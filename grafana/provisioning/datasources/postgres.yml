apiVersion: 1
datasources:
  - name: CloudMARLDB
    uid: cloudmarl-db
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: cloudmarl
    isDefault: true
    secureJsonData:
      password: cloudmarl
    jsonData:
      database: cloudmarl
      sslmode: disable
      postgresVersion: 1600
